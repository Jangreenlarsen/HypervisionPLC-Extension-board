; PlatformIO-projektkonfiguration for HypervisionPLC Extension board
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
; Placeholder-target — den præcise gateway-MCU/dev-board vælges under Fase 1
; (hardware-bring-up, EXPANSION_BOARD_DESIGN.md §9) og env-navnet opdateres
; herefter, jf. CLAUDE.md regel 14.
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -Wextra

[env:native]
; Hardware-uafhængige unit-tests — ingen ESP32-toolchain nødvendig. Kun
; test/*.cpp + de lib/-moduler testene selv #includer bygges (PlatformIOs
; Library Dependency Finder, "chain"-mode) — src/main.cpp (Arduino-specifik
; setup()/loop()) røres aldrig. Hold derfor al hardware-uafhængig,
; native-testbar logik (protokol/config/cache) i lib/<modul>/, ikke i src/,
; så fremtidige FreeRTOS/SPI-afhængige filer i src/ ikke også trækkes ind her.
platform = native
build_flags =
    -std=c++17
    -Wall
    -Wextra
test_framework = unity
